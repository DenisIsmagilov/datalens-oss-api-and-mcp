# Подключение к уже работающему DataLens OSS (docker compose).
# Сеть DataLens не создаём и его compose не правим.
#
#   cp env.example .env   # заполнить токены
#   docker compose up -d --build
#
# Имя сети: docker network ls  →  DATALENS_NETWORK (часто datalens_default).

services:
  datalens-api:
    build: ./datalens-api
    container_name: datalens-api
    environment:
      DL_API_TOKEN: ${DL_API_TOKEN}
      US_MASTER_TOKEN: ${US_MASTER_TOKEN}
      US_HOST: ${US_HOST:-http://us:8080}
      CONTROL_API_HOST: ${CONTROL_API_HOST:-http://control-api:8080}
      META_MANAGER_HOST: ${META_MANAGER_HOST:-http://meta-manager:8080}
      UI_API_HOST: ${UI_API_HOST:-http://ui-api:8080}
      DATA_API_HOST: ${DATA_API_HOST:-http://data-api:8080}
      CHARTS_HOST: ${CHARTS_HOST:-http://ui:8080}
      DATA_MAX_ROWS: ${DATA_MAX_ROWS:-500}
      DATA_MAX_DISTINCT: ${DATA_MAX_DISTINCT:-200}
      DATA_MAX_CELL_CHARS: ${DATA_MAX_CELL_CHARS:-500}
      DATA_QUERY_TIMEOUT_SEC: ${DATA_QUERY_TIMEOUT_SEC:-60}
      AUTH_HOST: ${AUTH_HOST:-http://auth:8080}
      AUTH_LOGIN: ${AUTH_LOGIN}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      DATALENS_API_PORT: ${DATALENS_API_PORT:-8393}
      DATALENS_API_VERSION_DEFAULT: ${DATALENS_API_VERSION_DEFAULT:-2}
      US_TENANT_ID: ${US_TENANT_ID:-common}
    ports:
      - "${DATALENS_API_PORT:-8393}:${DATALENS_API_PORT:-8393}"
    networks:
      - datalens

  datalens-mcp:
    build: ./datalens-mcp
    container_name: datalens-mcp
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      DL_API_TOKEN: ${DL_API_TOKEN}
      DATALENS_API_HOST: http://datalens-api:${DATALENS_API_PORT:-8393}
      DATALENS_MCP_PORT: ${DATALENS_MCP_PORT:-8394}
      DATALENS_API_VERSION: ${DATALENS_API_VERSION:-2}
      DATALENS_API_TIMEOUT_SEC: ${DATALENS_API_TIMEOUT_SEC:-90}
    ports:
      - "${DATALENS_MCP_PORT:-8394}:${DATALENS_MCP_PORT:-8394}"
    depends_on:
      - datalens-api
    networks:
      - datalens

  datalens-neuro:
    profiles: ["neuro", "panel"]
    build: ./datalens-neuro
    container_name: datalens-neuro
    environment:
      NEURO_ENABLED: ${NEURO_ENABLED:-true}
      NEURO_UI_ENABLED: ${NEURO_UI_ENABLED:-false}
      NEURO_UI_TITLE: ${NEURO_UI_TITLE:-Нейроаналитик}
      NEURO_UI_ROLES: ${NEURO_UI_ROLES:-datalens.admin,datalens.editor}
      NEURO_UI_ORIGINS: ${NEURO_UI_ORIGINS:-http://127.0.0.1:8080}
      NEURO_UI_CONVERSATION_IDLE_HOURS: ${NEURO_UI_CONVERSATION_IDLE_HOURS:-6}
      AUTH_TOKEN_PUBLIC_KEY: ${AUTH_TOKEN_PUBLIC_KEY:-}
      NEURO_PORT: ${NEURO_PORT:-8396}
      NEURO_API_TOKEN: ${NEURO_API_TOKEN}
      NEURO_DEFAULT_PACK: ${NEURO_DEFAULT_PACK:-default}
      NEURO_PACKS_DIR: /packs
      NEURO_DB_PATH: /data/neuro.sqlite
      NEURO_TIMEZONE: ${NEURO_TIMEZONE:-Europe/Moscow}
      NEURO_HISTORY_MESSAGES: ${NEURO_HISTORY_MESSAGES:-10}
      NEURO_MAX_ROUNDS: ${NEURO_MAX_ROUNDS:-15}
      NEURO_DEADLINE_SEC: ${NEURO_DEADLINE_SEC:-150}
      NEURO_FORMULA_ATTEMPTS: ${NEURO_FORMULA_ATTEMPTS:-3}
      NEURO_FORMULA_DOC_FRAGMENTS: ${NEURO_FORMULA_DOC_FRAGMENTS:-8}
      NEURO_FORMULA_DOC_CHARS: ${NEURO_FORMULA_DOC_CHARS:-6000}
      NEURO_TOOL_RESULT_MAX_CHARS: ${NEURO_TOOL_RESULT_MAX_CHARS:-12000}
      NEURO_CONVERSATION_TTL_DAYS: ${NEURO_CONVERSATION_TTL_DAYS:-30}
      NEURO_RATE_LIMIT_PER_MIN: ${NEURO_RATE_LIMIT_PER_MIN:-30}
      DATALENS_API_HOST: http://datalens-api:${DATALENS_API_PORT:-8393}
      DL_API_TOKEN: ${DL_API_TOKEN}
      DATALENS_API_TIMEOUT_SEC: ${DATALENS_API_TIMEOUT_SEC:-90}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
    ports:
      - "${NEURO_PORT:-8396}:${NEURO_PORT:-8396}"
    volumes:
      - neuro_data:/data
      - ./datalens-neuro/formula-docs:/app/formula-docs:ro
    depends_on:
      - datalens-api
    networks:
      - datalens

  datalens-neuro-panel:
    profiles: ["panel"]
    image: nginx:alpine
    container_name: datalens-neuro-panel
    environment:
      DATALENS_UI_UPSTREAM: ${DATALENS_UI_UPSTREAM:-http://ui:8080}
      NEURO_PUBLIC_ORIGIN: ${NEURO_PUBLIC_ORIGIN:-http://127.0.0.1:8396}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        escaped=$$(printf '%s' "$$NEURO_PUBLIC_ORIGIN" | sed 's/\\/\\\\/g; s/"/\\"/g')
        export NEURO_PUBLIC_ORIGIN_JSON="\"$$escaped\""
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    ports:
      - "${DATALENS_UI_PORT:-8080}:8080"
    volumes:
      - ./panel/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - datalens-neuro
    networks:
      - datalens

volumes:
  neuro_data:

networks:
  datalens:
    external: true
    name: ${DATALENS_NETWORK:-datalens_default}
